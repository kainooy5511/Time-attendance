<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ประวัติการลงเวลา — Smart Attendance</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="js/api-config.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #090d16 0%, #111827 50%, #0b1329 100%);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --card-hover: rgba(255, 255, 255, 0.09);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --success: #10b981;
      --input-bg: rgba(255, 255, 255, 0.06);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    [data-theme="light"] {
      --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 50%, #f8fafc 100%);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(226, 232, 240, 0.85);
      --card-hover: rgba(255, 255, 255, 1);
      --accent: #4f46e5;
      --accent-glow: rgba(79, 70, 229, 0.2);
      --success: #059669;
      --input-bg: #ffffff;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.3s, color 0.3s, border-color 0.3s; }

    body {
      font-family: 'Sarabun', sans-serif;
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 60px;
      position: relative;
    }

    .container {
      width: 100%;
      max-width: 600px;
      position: relative;
      z-index: 1;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9em;
      padding: 8px 14px;
      border-radius: 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
    }
    .back-btn:hover { color: var(--text-main); background: var(--card-hover); }

    .theme-toggle-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--card-bg); border: 1px solid var(--card-border);
      color: var(--text-main); display: flex; align-items: center; justify-content: center;
      font-size: 1.1em; cursor: pointer; backdrop-filter: blur(12px);
    }

    .header { text-align: center; margin-bottom: 20px; }
    .header h2 { font-size: 1.6em; font-weight: 700; margin-bottom: 4px; }
    .header p { font-size: 0.88em; color: var(--text-muted); }

    /* Overview Stats */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat-card {
      padding: 14px 10px;
      border-radius: 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      text-align: center;
      box-shadow: var(--shadow);
    }
    .stat-number { font-size: 1.6em; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 0.76em; color: var(--text-muted); }

    /* Search & Filter */
    .search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .search-input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 14px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-size: 0.95em;
      font-family: inherit;
      outline: none;
      box-shadow: var(--shadow);
    }
    .search-input:focus { border-color: var(--accent); }

    .refresh-btn {
      padding: 12px 16px;
      border-radius: 14px;
      background: var(--accent);
      border: none;
      color: white;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    /* History List */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .history-card {
      padding: 16px;
      border-radius: 18px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
    }

    .avatar-wrap {
      width: 52px; height: 52px;
      border-radius: 16px;
      overflow: hidden;
      flex-shrink: 0;
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3em; font-weight: 700; color: white;
    }
    .avatar-img {
      width: 100%; height: 100%; object-fit: cover;
    }

    .user-details .name {
      font-size: 1.05em; font-weight: 600; color: var(--text-main); margin-bottom: 2px;
    }

    .meta-tags {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px;
    }
    .meta-tag {
      font-size: 0.74em; font-weight: 600; padding: 2px 8px; border-radius: 12px;
      background: rgba(255, 255, 255, 0.08); border: 1px solid var(--card-border);
      color: var(--text-muted);
    }

    .date-time {
      font-size: 0.82em; color: var(--text-muted); display: flex; gap: 8px;
    }

    .card-right {
      display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
    }

    .type-badge {
      font-size: 0.8em; font-weight: 700; padding: 4px 10px; border-radius: 14px;
    }
    .type-in  { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .type-out { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .type-ot  { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }

    .status-tag {
      font-size: 0.74em; font-weight: 600; color: var(--text-muted);
    }
    .status-tag.late { color: #f87171; font-weight: 700; }

    .map-link {
      font-size: 0.76em; color: #38bdf8; text-decoration: none;
    }
    .map-link:hover { text-decoration: underline; }

    .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }
  </style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <a href="index.html" class="back-btn">← กลับเมนูหลัก</a>
    <button class="theme-toggle-btn" id="themeBtn" onclick="toggleTheme()" title="เปลี่ยนธีม">🌙</button>
  </div>

  <div class="header">
    <h2>📋 ประวัติการลงเวลาเข้า-ออกงาน</h2>
    <p>ตรวจสอบสถิติการตอกบัตร แผนก และพิกัด GPS</p>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-number" id="todayCheckIn">0</div>
      <div class="stat-label">เข้างานวันนี้</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="todayCheckOut">0</div>
      <div class="stat-label">ออกงานวันนี้</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="totalRecords">0</div>
      <div class="stat-label">ประวัติทั้งหมด</div>
    </div>
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 ค้นหาชื่อ หรือ รหัสพนักงาน..." oninput="filterList()">
    <button class="refresh-btn" onclick="loadAttendance()">🔄 โหลดใหม่</button>
  </div>

  <div class="history-list" id="historyList">
    <div class="empty-state">⏳ กำลังโหลดประวัติการเข้างาน...</div>
  </div>
</div>

<script>
  let allAttendance = [];

  function initTheme() {
    const saved = localStorage.getItem('app_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
    document.getElementById('themeBtn').innerText = saved === 'light' ? '☀️' : '🌙';
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme') || 'dark';
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('app_theme', next);
    document.getElementById('themeBtn').innerText = next === 'light' ? '☀️' : '🌙';
  }

  async function loadAttendance() {
    const listEl = document.getElementById('historyList');
    listEl.innerHTML = '<div class="empty-state">⏳ กำลังดึงข้อมูลจาก Google Sheets...</div>';

    // 1. Local Cache
    let localLogs = [];
    try {
      localLogs = JSON.parse(localStorage.getItem('localAttendanceLogs') || '[]');
    } catch(e) {}

    // 2. Google Apps Script
    const apiUrl = localStorage.getItem('gasApiUrl') || (typeof GAS_API_URL !== 'undefined' ? GAS_API_URL : '');
    let remoteLogs = [];

    if (apiUrl) {
      try {
        const res = await fetch(apiUrl + '?action=getAttendance');
        if (res.ok) {
          remoteLogs = await res.json();
        }
      } catch(err) {
        console.warn('Cannot fetch remote logs:', err);
      }
    }

    // Merge
    const combined = [...remoteLogs];
    localLogs.forEach(loc => {
      const exists = combined.some(r => r.name === loc.name && r.time === loc.time && r.date === loc.date);
      if (!exists) combined.unshift(loc);
    });

    allAttendance = combined;
    renderList(allAttendance);
  }

  function renderList(items) {
    const listEl = document.getElementById('historyList');
    document.getElementById('totalRecords').innerText = items.length;

    let inCount = 0;
    let outCount = 0;
    const today = new Date().getDate();

    items.forEach(item => {
      if (item.date && String(item.date).includes(today)) {
        if ((item.type || '').includes('Check-In') || (item.type || '').includes('เข้างาน')) inCount++;
        else if ((item.type || '').includes('Check-Out') || (item.type || '').includes('ออกงาน')) outCount++;
      }
    });

    document.getElementById('todayCheckIn').innerText = inCount;
    document.getElementById('todayCheckOut').innerText = outCount;

    if (!items || items.length === 0) {
      listEl.innerHTML = '<div class="empty-state">📭 ยังไม่มีประวัติการลงเวลาในระบบ</div>';
      return;
    }

    listEl.innerHTML = items.map(item => {
      const typeStr = item.type || 'เข้างาน (Check-In)';
      const typeClass = typeStr.includes('Check-Out') ? 'type-out' : typeStr.includes('OT') ? 'type-ot' : 'type-in';
      const isLate = (item.status || '').includes('สาย');
      const photoHtml = (item.photoLink && item.photoLink.startsWith('data:image'))
        ? `<img class="avatar-img" src="${item.photoLink}" alt="Photo">`
        : (item.name ? item.name.charAt(0).toUpperCase() : '?');

      const mapLink = item.mapLink && item.mapLink.startsWith('http')
        ? `<a href="${item.mapLink}" target="_blank" class="map-link">📍 Google Maps</a>` : '';

      return `
        <div class="history-card">
          <div class="user-info">
            <div class="avatar-wrap">
              ${photoHtml}
            </div>
            <div class="user-details">
              <div class="name">${item.name || 'พนักงาน'}</div>
              <div class="meta-tags">
                <span class="meta-tag">🆔 ${item.employeeId || 'EMP'}</span>
                <span class="meta-tag">🏢 ${item.department || 'ทั่วไป'}</span>
              </div>
              <div class="date-time">
                <span>🕒 ${item.time || '-'}</span>
                <span>📅 ${item.date || '-'}</span>
                ${mapLink}
              </div>
            </div>
          </div>
          <div class="card-right">
            <span class="type-badge ${typeClass}">${typeStr}</span>
            <span class="status-tag ${isLate ? 'late' : ''}">สถานะ: ${item.status || 'ปกติ'}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterList() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    if (!q) {
      renderList(allAttendance);
      return;
    }
    const filtered = allAttendance.filter(i =>
      (i.name || '').toLowerCase().includes(q) ||
      (i.employeeId || '').toLowerCase().includes(q) ||
      (i.department || '').toLowerCase().includes(q)
    );
    renderList(filtered);
  }

  window.addEventListener('load', () => {
    initTheme();
    loadAttendance();
  });
</script>

</body>
</html>
