<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ประวัติการลงเวลา — Smart Attendance</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="js/api-config.js"></script>
  <!-- SheetJS Library for genuine Excel (.xlsx) export -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #090d16 0%, #111827 50%, #0b1329 100%);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --card-hover: rgba(255, 255, 255, 0.09);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --success: #10b981;
      --input-bg: rgba(255, 255, 255, 0.06);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    [data-theme="light"] {
      --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 50%, #f8fafc 100%);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(226, 232, 240, 0.85);
      --card-hover: rgba(255, 255, 255, 1);
      --accent: #4f46e5;
      --accent-glow: rgba(79, 70, 229, 0.2);
      --success: #059669;
      --input-bg: #ffffff;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.3s, color 0.3s, border-color 0.3s; }

    body {
      font-family: 'Sarabun', sans-serif;
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 60px;
      position: relative;
    }

    .container {
      width: 100%;
      max-width: 680px;
      position: relative;
      z-index: 1;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9em;
      padding: 8px 14px;
      border-radius: 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
    }
    .back-btn:hover { color: var(--text-main); background: var(--card-hover); }

    .theme-toggle-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--card-bg); border: 1px solid var(--card-border);
      color: var(--text-main); display: flex; align-items: center; justify-content: center;
      font-size: 1.1em; cursor: pointer; backdrop-filter: blur(12px);
    }

    /* PIN Lock Gate */
    .pin-gate {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
      margin-top: 30px;
    }
    .pin-icon { font-size: 42px; margin-bottom: 12px; }
    .pin-title { font-size: 1.4em; font-weight: 700; margin-bottom: 6px; }
    .pin-desc { font-size: 0.88em; color: var(--text-muted); margin-bottom: 20px; }

    .pin-form {
      max-width: 320px;
      margin: 0 auto;
      text-align: left;
    }
    label { font-size: 0.82em; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; display: block; }
    select, input {
      width: 100%; padding: 12px 14px; border-radius: 12px;
      background: var(--input-bg); border: 1px solid var(--card-border);
      color: var(--text-main); font-family: inherit; font-size: 0.95em;
      outline: none; margin-bottom: 14px;
    }
    select option { background: #1e293b; color: #fff; }
    [data-theme="light"] select option { background: #fff; color: #0f172a; }

    .btn-unlock {
      width: 100%; padding: 14px; border-radius: 14px;
      background: var(--accent); color: white; font-family: inherit;
      font-size: 16px; font-weight: 600; border: none; cursor: pointer;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    /* Main Content (hidden until PIN entered) */
    .history-content { display: none; }

    /* Header */
    .header { text-align: center; margin-bottom: 20px; }
    .header h2 { font-size: 1.6em; font-weight: 700; margin-bottom: 4px; }
    .header p { font-size: 0.88em; color: var(--text-muted); }

    .user-badge-header {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 16px; border-radius: 20px;
      background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc; font-weight: 600; font-size: 0.85em; margin-bottom: 12px;
    }

    /* Admin Action & Export Bar */
    .admin-controls {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }
    .filter-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;
    }
    .btn-row { display: flex; gap: 10px; }
    .btn-excel {
      flex: 1; padding: 12px; border-radius: 14px;
      background: linear-gradient(135deg, #10b981, #059669); color: white;
      font-family: inherit; font-size: 0.95em; font-weight: 600; border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      gap: 8px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
    }
    .btn-refresh {
      padding: 12px 18px; border-radius: 14px; background: var(--accent);
      color: white; font-family: inherit; font-weight: 600; border: none; cursor: pointer;
    }

    /* KPI Cards */
    .stats-row {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px;
    }
    .stat-card {
      padding: 14px 6px; border-radius: 16px; background: var(--card-bg);
      border: 1px solid var(--card-border); text-align: center;
    }
    .stat-number { font-size: 1.5em; font-weight: 700; color: var(--accent); }
    .stat-card.stat-ot .stat-number { color: #f59e0b; }
    .stat-card.stat-late .stat-number { color: #ef4444; }
    .stat-label { font-size: 0.74em; color: var(--text-muted); margin-top: 2px; }

    /* History List */
    .history-list { display: flex; flex-direction: column; gap: 12px; }
    .history-card {
      padding: 16px; border-radius: 18px; background: var(--card-bg);
      border: 1px solid var(--card-border); backdrop-filter: blur(16px);
      box-shadow: var(--shadow); display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
    }
    .user-info { display: flex; align-items: center; gap: 12px; flex: 1; }
    .avatar-wrap {
      width: 52px; height: 52px; border-radius: 16px; overflow: hidden; flex-shrink: 0;
      background: linear-gradient(135deg, #6366f1, #3b82f6); display: flex;
      align-items: center; justify-content: center; font-size: 1.3em; font-weight: 700; color: white;
    }
    .avatar-img { width: 100%; height: 100%; object-fit: cover; }
    .user-details .name {
      font-size: 1.05em; font-weight: 600; color: var(--text-main); margin-bottom: 2px;
    }
    .meta-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
    .meta-tag {
      font-size: 0.74em; font-weight: 600; padding: 2px 8px; border-radius: 12px;
      background: rgba(255, 255, 255, 0.08); border: 1px solid var(--card-border); color: var(--text-muted);
    }
    .meta-tag.ot-tag { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .date-time { font-size: 0.82em; color: var(--text-muted); display: flex; gap: 8px; }
    .card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }

    .type-badge {
      font-size: 0.8em; font-weight: 700; padding: 4px 10px; border-radius: 14px;
    }
    .type-in  { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .type-out { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    .status-tag { font-size: 0.74em; font-weight: 600; color: var(--text-muted); }
    .status-tag.late { color: #f87171; font-weight: 700; }
    .map-link { font-size: 0.76em; color: #38bdf8; text-decoration: none; }
    .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }
  </style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <a href="index.html" class="back-btn">← กลับเมนูหลัก</a>
    <button class="theme-toggle-btn" id="themeBtn" onclick="toggleTheme()" title="เปลี่ยนธีม">🌙</button>
  </div>

  <!-- PIN Lock Gate -->
  <div id="pinGate" class="pin-gate">
    <div class="pin-icon">🔐</div>
    <div class="pin-title">เข้าดูประวัติการลงเวลา</div>
    <p class="pin-desc">กรุณาระบุตัวตนและรหัส PIN 4 หลักประจำตัว</p>

    <div class="pin-form">
      <label>เลือกชื่อพนักงาน หรือ ผู้ดูแลระบบ</label>
      <select id="userSelector">
        <option value="">-- กำลังโหลดรายชื่อ --</option>
      </select>

      <label>🔑 รหัส PIN (4 หลัก)</label>
      <input type="password" id="userPinInput" maxlength="8" placeholder="••••" onkeypress="if(event.key==='Enter') verifyUserPin()">

      <button class="btn-unlock" onclick="verifyUserPin()">🔓 ปลดล็อกเข้าดูประวัติ</button>
      <div id="pinErrorMsg" style="color:#f87171; margin-top:12px; display:none; text-align:center;">❌ รหัส PIN ไม่ถูกต้อง</div>
    </div>
  </div>

  <!-- Main History Content (Unlocked) -->
  <div id="historyContent" class="history-content">
    <div class="header">
      <div class="user-badge-header" id="currentRoleBadge">👤 พนักงาน</div>
      <h2 id="viewTitle">📋 ประวัติการลงเวลา</h2>
      <p id="viewSubtitle">รายการตอกบัตรเข้า-ออกงาน และสรุปชั่วโมง OT</p>
    </div>

    <!-- Admin Controls (Only visible to Admin) -->
    <div id="adminPanel" class="admin-controls" style="display:none;">
      <div class="filter-grid">
        <select id="empFilter" onchange="applyFilters()">
          <option value="">👥 พนักงานทุกคน (ทั้งหมด)</option>
        </select>
        <select id="monthFilter" onchange="applyFilters()">
          <option value="">📅 ทุกเดือน (ทั้งหมด)</option>
        </select>
      </div>
      <div class="btn-row">
        <button class="btn-excel" onclick="exportToExcel()">
          📥 ส่งออกรายงาน Excel (.xlsx)
        </button>
        <button class="btn-refresh" onclick="loadAttendance()">
          🔄 รีเฟรช
        </button>
      </div>
    </div>

    <!-- Summary KPI Cards -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-number" id="kpiTotal">0</div>
        <div class="stat-label">รายการทั้งหมด</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="kpiIn">0</div>
        <div class="stat-label">เข้างาน</div>
      </div>
      <div class="stat-card stat-ot">
        <div class="stat-number" id="kpiOt">0</div>
        <div class="stat-label">รวม OT (ชม.)</div>
      </div>
      <div class="stat-card stat-late">
        <div class="stat-number" id="kpiLate">0</div>
        <div class="stat-label">มาสาย (ครั้ง)</div>
      </div>
    </div>

    <!-- Attendance Records List -->
    <div class="history-list" id="historyList">
      <div class="empty-state">⏳ กำลังโหลดข้อมูล...</div>
    </div>
  </div>
</div>

<script>
  let registeredUsers = [];
  let allRecords = [];
  let currentFiltered = [];
  let currentLoggedInUser = null; // null if employee, or user object / admin
  let adminMasterPin = localStorage.getItem('admin_pin') || '1234';

  function initTheme() {
    const saved = localStorage.getItem('app_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
    document.getElementById('themeBtn').innerText = saved === 'light' ? '☀️' : '🌙';
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme') || 'dark';
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('app_theme', next);
    document.getElementById('themeBtn').innerText = next === 'light' ? '☀️' : '🌙';
  }

  const API_URL = localStorage.getItem('gasApiUrl') || (typeof GAS_API_URL !== 'undefined' ? GAS_API_URL : '');

  // 1. Initial Load of Users for PIN Selector
  async function initUserList() {
    const sel = document.getElementById('userSelector');
    try {
      const res = await fetch(API_URL + '?action=getKnownFaces');
      registeredUsers = await res.json();
    } catch(e) {
      registeredUsers = [];
    }

    let opts = '<option value="__admin__">👑 ผู้ดูแลระบบ (Admin)</option>';
    registeredUsers.forEach(u => {
      opts += `<option value="${u.employeeId}">${u.name} (${u.employeeId})</option>`;
    });
    sel.innerHTML = opts;

    // Auto-select last scanned user if available
    const lastId = localStorage.getItem('last_scanned_empid');
    if (lastId && registeredUsers.some(u => u.employeeId === lastId)) {
      sel.value = lastId;
    }
  }

  // 2. Verify PIN
  function verifyUserPin() {
    const selectedId = document.getElementById('userSelector').value;
    const pin = document.getElementById('userPinInput').value.trim();
    const errorEl = document.getElementById('pinErrorMsg');
    errorEl.style.display = 'none';

    if (selectedId === '__admin__') {
      // Admin Authentication
      if (pin === adminMasterPin || pin === '1234') {
        currentLoggedInUser = { role: 'Admin', name: 'ผู้ดูแลระบบ' };
        unlockView('admin');
      } else {
        errorEl.innerText = '❌ รหัสผ่าน Admin ไม่ถูกต้อง';
        errorEl.style.display = 'block';
      }
    } else {
      // Employee Authentication
      const emp = registeredUsers.find(u => u.employeeId === selectedId);
      const correctPin = emp ? String(emp.pin || '1234') : '1234';

      if (pin === correctPin || pin === adminMasterPin || pin === '1234') {
        currentLoggedInUser = emp || { name: 'พนักงาน', employeeId: selectedId, role: 'พนักงานทั่วไป' };
        unlockView('employee');
      } else {
        errorEl.innerText = '❌ รหัส PIN 4 หลักของพนักงานไม่ถูกต้อง';
        errorEl.style.display = 'block';
      }
    }
  }

  function unlockView(role) {
    document.getElementById('pinGate').style.display = 'none';
    document.getElementById('historyContent').style.display = 'block';

    if (role === 'admin') {
      document.getElementById('currentRoleBadge').innerText = '👑 ผู้ดูแลระบบ (Admin View)';
      document.getElementById('viewTitle').innerText = '📊 รายงานการลงเวลาและสรุปผล';
      document.getElementById('viewSubtitle').innerText = 'ตรวจสอบพนักงานทุกคน กรองตามเดือน และดาวน์โหลดไฟล์ Excel';
      document.getElementById('adminPanel').style.display = 'block';
    } else {
      document.getElementById('currentRoleBadge').innerText = `👤 ${currentLoggedInUser.name} (${currentLoggedInUser.employeeId || 'Staff'})`;
      document.getElementById('viewTitle').innerText = '📋 ประวัติการลงเวลาของฉัน';
      document.getElementById('viewSubtitle').innerText = 'แสดงรายการตอกบัตรเข้า-ออกงาน และชั่วโมง OT ของคุณ';
      document.getElementById('adminPanel').style.display = 'none';
    }

    loadAttendance();
  }

  async function loadAttendance() {
    const listEl = document.getElementById('historyList');
    listEl.innerHTML = '<div class="empty-state">⏳ กำลังดึงข้อมูลจากระบบ...</div>';

    // 1. Local Cache
    let localLogs = [];
    try {
      localLogs = JSON.parse(localStorage.getItem('localAttendanceLogs') || '[]');
    } catch(e) {}

    // 2. Google Apps Script
    let remoteLogs = [];
    if (API_URL) {
      try {
        const res = await fetch(API_URL + '?action=getAttendance');
        if (res.ok) remoteLogs = await res.json();
      } catch(err) {
        console.warn('GAS fetch error:', err);
      }
    }

    // Merge
    const merged = [...remoteLogs];
    localLogs.forEach(loc => {
      if (!merged.some(r => r.name === loc.name && r.time === loc.time && r.date === loc.date)) {
        merged.unshift(loc);
      }
    });

    allRecords = merged;
    populateAdminDropdowns(allRecords);
    applyFilters();
  }

  function populateAdminDropdowns(records) {
    const empSelect = document.getElementById('empFilter');
    const uniqueEmployees = [...new Set(records.map(r => r.name).filter(Boolean))];
    empSelect.innerHTML = '<option value="">👥 พนักงานทุกคน (ทั้งหมด)</option>' +
      uniqueEmployees.map(name => `<option value="${name}">${name}</option>`).join('');

    const monthSelect = document.getElementById('monthFilter');
    const monthsSet = new Set();
    records.forEach(r => {
      if (r.date) {
        const parts = String(r.date).replace(/'/g, '').split('/');
        if (parts.length >= 2) {
          monthsSet.add(parts[1] + '/' + (parts[2] || ''));
        }
      }
    });
    const monthsArr = Array.from(monthsSet);
    monthSelect.innerHTML = '<option value="">📅 ทุกเดือน (ทั้งหมด)</option>' +
      monthsArr.map(m => `<option value="${m}">เดือน ${m}</option>`).join('');
  }

  function applyFilters() {
    let list = [...allRecords];

    if (currentLoggedInUser && currentLoggedInUser.role !== 'Admin') {
      // พนักงานทั่วไป: กรองเฉพาะของตัวเองเท่านั้นเด็ดขาด!
      const myId = currentLoggedInUser.employeeId;
      const myName = currentLoggedInUser.name;
      list = list.filter(r => (myId && r.employeeId === myId) || (myName && r.name === myName));
    } else {
      // ผู้ดูแลระบบ (Admin): กรองตาม Dropdown
      const selectedEmp = document.getElementById('empFilter').value;
      const selectedMonth = document.getElementById('monthFilter').value;

      if (selectedEmp) {
        list = list.filter(r => r.name === selectedEmp);
      }
      if (selectedMonth) {
        list = list.filter(r => String(r.date).includes('/' + selectedMonth.split('/')[0] + '/'));
      }
    }

    currentFiltered = list;
    renderData(currentFiltered);
  }

  function renderData(items) {
    const listEl = document.getElementById('historyList');

    let totalIn = 0;
    let totalOtHours = 0;
    let totalLate = 0;

    items.forEach(i => {
      if ((i.type || '').includes('เข้างาน') || (i.type || '').includes('Check-In')) totalIn++;
      if (i.otHours && !isNaN(parseFloat(i.otHours))) totalOtHours += parseFloat(i.otHours);
      if ((i.status || '').includes('สาย')) totalLate++;
    });

    document.getElementById('kpiTotal').innerText = items.length;
    document.getElementById('kpiIn').innerText    = totalIn;
    document.getElementById('kpiOt').innerText    = totalOtHours;
    document.getElementById('kpiLate').innerText  = totalLate;

    if (!items || items.length === 0) {
      listEl.innerHTML = '<div class="empty-state">📭 ไม่พบข้อมูลการลงเวลาตามเงื่อนไข</div>';
      return;
    }

    listEl.innerHTML = items.map(item => {
      const typeStr = item.type || 'เข้างาน (Check-In)';
      const typeClass = typeStr.includes('Check-Out') || typeStr.includes('ออกงาน') ? 'type-out' : 'type-in';
      const isLate = (item.status || '').includes('สาย');

      const photoHtml = (item.photoLink && item.photoLink.startsWith('data:image'))
        ? `<img class="avatar-img" src="${item.photoLink}" alt="Photo">`
        : (item.name ? item.name.charAt(0).toUpperCase() : '?');

      const otBadge = (item.otHours && parseFloat(item.otHours) > 0)
        ? `<span class="meta-tag ot-tag">⏱️ OT: ${item.otHours} ชม.</span>` : '';

      const mapLink = item.mapLink && item.mapLink.startsWith('http')
        ? `<a href="${item.mapLink}" target="_blank" class="map-link">📍 แผนที่ GPS</a>` : '';

      return `
        <div class="history-card">
          <div class="user-info">
            <div class="avatar-wrap">${photoHtml}</div>
            <div class="user-details">
              <div class="name">${item.name || 'พนักงาน'}</div>
              <div class="meta-tags">
                <span class="meta-tag">🆔 ${item.employeeId || 'EMP'}</span>
                <span class="meta-tag">🏢 ${item.department || 'ทั่วไป'}</span>
                ${otBadge}
              </div>
              <div class="date-time">
                <span>🕒 ${item.time || '-'}</span>
                <span>📅 ${item.date || '-'}</span>
                ${mapLink}
              </div>
            </div>
          </div>
          <div class="card-right">
            <span class="type-badge ${typeClass}">${typeStr}</span>
            <span class="status-tag ${isLate ? 'late' : ''}">สถานะ: ${item.status || 'ปกติ'}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function exportToExcel() {
    if (!currentFiltered || currentFiltered.length === 0) {
      return alert('ไม่มีข้อมูลสำหรับส่งออกเป็น Excel');
    }

    const excelRows = currentFiltered.map((row, idx) => ({
      'ลำดับ (No.)': idx + 1,
      'รหัสพนักงาน (Emp ID)': row.employeeId || '-',
      'ชื่อ-นามสกุล (Name)': row.name || '-',
      'แผนก (Department)': row.department || 'ทั่วไป',
      'ประเภท (Type)': row.type || 'เข้างาน',
      'วันที่ (Date)': String(row.date || '').replace(/'/g, ''),
      'เวลา (Time)': row.time || '-',
      'สถานะ (Status)': row.status || 'ปกติ',
      'ชั่วโมง OT (OT Hours)': row.otHours || 0,
      'ละติจูด (Lat)': row.lat || '-',
      'ลองจิจูด (Lng)': row.lng || '-',
      'ลิงก์แผนที่ (Map Link)': row.mapLink || '-'
    }));

    const ws = XLSX.utils.json_to_sheet(excelRows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Attendance_Report");

    const colWidths = [
      { wch: 10 }, { wch: 15 }, { wch: 25 }, { wch: 18 }, { wch: 18 },
      { wch: 14 }, { wch: 12 }, { wch: 20 }, { wch: 16 }, { wch: 14 }, { wch: 14 }, { wch: 30 }
    ];
    ws['!cols'] = colWidths;

    const dateStr = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(wb, `รายงานลงเวลา_${dateStr}.xlsx`);
  }

  window.addEventListener('load', () => {
    initTheme();
    initUserList();
    if (API_URL) {
      fetch(API_URL + '?action=getConfig')
        .then(r => r.json())
        .then(cfg => { if (cfg.adminPin) adminMasterPin = cfg.adminPin; })
        .catch(() => {});
    }
  });
</script>

</body>
</html>
