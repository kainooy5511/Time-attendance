<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ประวัติการลงเวลาเข้างาน</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="js/api-config.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #090d16 0%, #111827 50%, #0b1329 100%);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --card-hover: rgba(255, 255, 255, 0.09);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.3);
      --input-bg: rgba(255, 255, 255, 0.06);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    [data-theme="light"] {
      --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 50%, #f8fafc 100%);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(226, 232, 240, 0.8);
      --card-hover: rgba(255, 255, 255, 1);
      --accent: #4f46e5;
      --accent-glow: rgba(79, 70, 229, 0.2);
      --success: #059669;
      --success-glow: rgba(5, 150, 105, 0.2);
      --input-bg: #ffffff;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }

    body {
      font-family: 'Sarabun', sans-serif;
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 60px;
      position: relative;
    }

    .container {
      width: 100%;
      max-width: 580px;
      position: relative;
      z-index: 1;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9em;
      padding: 8px 14px;
      border-radius: 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
    }
    .back-btn:hover { color: var(--text-main); background: var(--card-hover); }

    .theme-toggle-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1em;
      cursor: pointer;
      backdrop-filter: blur(12px);
    }

    /* Header */
    .header {
      margin-bottom: 20px;
      text-align: center;
    }

    .header h2 {
      font-size: 1.6em;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 0.88em;
      color: var(--text-muted);
    }

    /* Filter & Search Bar */
    .search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .search-input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 14px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-size: 0.95em;
      font-family: inherit;
      outline: none;
      box-shadow: var(--shadow);
    }
    .search-input:focus { border-color: var(--accent); }

    .refresh-btn {
      padding: 12px 18px;
      border-radius: 14px;
      background: var(--accent);
      border: none;
      color: white;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    /* Stats Overview */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      padding: 16px;
      border-radius: 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      text-align: center;
      box-shadow: var(--shadow);
    }
    .stat-number {
      font-size: 1.8em;
      font-weight: 700;
      color: var(--accent);
    }
    .stat-label {
      font-size: 0.8em;
      color: var(--text-muted);
    }

    /* Attendance List */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .history-card {
      padding: 18px;
      border-radius: 18px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .history-card:hover {
      transform: translateY(-2px);
      background: var(--card-hover);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2em;
      font-weight: 700;
      flex-shrink: 0;
    }

    .user-details .name {
      font-size: 1.05em;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .user-details .date-time {
      font-size: 0.82em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.78em;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      white-space: nowrap;
    }
    [data-theme="light"] .status-badge {
      background: #ecfdf5;
      color: #059669;
      border-color: #a7f3d0;
    }

    .map-btn {
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.82em;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 4px;
    }
    .map-btn:hover { text-decoration: underline; }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 0.95em;
    }

    /* Ambient lighting */
    body::before {
      content: '';
      position: fixed;
      width: 400px;
      height: 400px;
      background: var(--accent);
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.1;
      top: -100px;
      left: -100px;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <a href="index.html" class="back-btn">← กลับเมนูหลัก</a>
    <button class="theme-toggle-btn" id="themeBtn" onclick="toggleTheme()" title="เปลี่ยนธีม">🌙</button>
  </div>

  <div class="header">
    <h2>📋 ประวัติการลงเวลาเข้างาน</h2>
    <p>ตรวจสอบเวลาเข้างานและพิกัด GPS ล่าสุด</p>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-number" id="todayCount">0</div>
      <div class="stat-label">ลงเวลาวันนี้ (คน)</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="totalCount">0</div>
      <div class="stat-label">ประวัติทั้งหมด (ครั้ง)</div>
    </div>
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 ค้นหาชื่อพนักงาน..." oninput="filterList()">
    <button class="refresh-btn" onclick="loadAttendance()">🔄 โหลดใหม่</button>
  </div>

  <div class="history-list" id="historyList">
    <div class="empty-state">⏳ กำลังโหลดประวัติการเข้างาน...</div>
  </div>
</div>

<script>
  let allAttendance = [];

  // Theme Management
  function initTheme() {
    const saved = localStorage.getItem('app_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
    document.getElementById('themeBtn').innerText = saved === 'light' ? '☀️' : '🌙';
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme') || 'dark';
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('app_theme', next);
    document.getElementById('themeBtn').innerText = next === 'light' ? '☀️' : '🌙';
  }

  // Load Data
  async function loadAttendance() {
    const listEl = document.getElementById('historyList');
    listEl.innerHTML = '<div class="empty-state">⏳ กำลังดึงข้อมูลจากระบบ...</div>';

    // 1. Local Cache
    let localLogs = [];
    try {
      localLogs = JSON.parse(localStorage.getItem('localAttendanceLogs') || '[]');
    } catch(e) {}

    // 2. Google Apps Script
    const apiUrl = localStorage.getItem('gasApiUrl') || (typeof GAS_API_URL !== 'undefined' ? GAS_API_URL : '');
    let remoteLogs = [];

    if (apiUrl) {
      try {
        const res = await fetch(apiUrl + '?action=getAttendance');
        if (res.ok) {
          remoteLogs = await res.json();
        }
      } catch(err) {
        console.warn('Cannot fetch remote logs:', err);
      }
    }

    // Combine & Deduplicate
    const combined = [...remoteLogs];
    localLogs.forEach(loc => {
      const exists = combined.some(r => r.name === loc.name && r.time === loc.time && r.date === loc.date);
      if (!exists) combined.unshift(loc);
    });

    allAttendance = combined;
    renderList(allAttendance);
  }

  function renderList(items) {
    const listEl = document.getElementById('historyList');
    document.getElementById('totalCount').innerText = items.length;

    const todayStr = new Date().toLocaleDateString('th-TH');
    const todayItems = items.filter(item => {
      return item.date && item.date.includes(new Date().getDate());
    });
    document.getElementById('todayCount').innerText = todayItems.length;

    if (!items || items.length === 0) {
      listEl.innerHTML = '<div class="empty-state">📭 ยังไม่มีประวัติการลงเวลาเข้างาน</div>';
      return;
    }

    listEl.innerHTML = items.map(item => {
      const initial = item.name ? item.name.charAt(0).toUpperCase() : '?';
      const mapBtn = item.mapLink ? `<a href="${item.mapLink}" target="_blank" class="map-btn">📍 ดูแผนที่ Google Maps</a>` : '';
      return `
        <div class="history-card">
          <div class="user-info">
            <div class="avatar">${initial}</div>
            <div class="user-details">
              <div class="name">${item.name || 'พนักงาน'}</div>
              <div class="date-time">
                <span>🕒 ${item.time || '-'}</span>
                <span>📅 ${item.date || '-'}</span>
              </div>
              ${mapBtn}
            </div>
          </div>
          <div class="status-badge">
            ✅ เข้างานแล้ว
          </div>
        </div>
      `;
    }).join('');
  }

  function filterList() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    if (!q) {
      renderList(allAttendance);
      return;
    }
    const filtered = allAttendance.filter(i => (i.name || '').toLowerCase().includes(q));
    renderList(filtered);
  }

  window.addEventListener('load', () => {
    initTheme();
    loadAttendance();
  });
</script>

</body>
</html>
