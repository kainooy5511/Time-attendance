<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#grad)"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#ffffff" stroke-width="20" stroke-opacity="0.3"/>
  
  <!-- Face/Scan Corner Brackets -->
  <path d="M 120 180 L 120 140 A 20 20 0 0 1 140 120 L 180 120" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
  <path d="M 392 180 L 392 140 A 20 20 0 0 0 372 120 L 332 120" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
  <path d="M 120 332 L 120 372 A 20 20 0 0 0 140 392 L 180 392" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
  <path d="M 392 332 L 392 372 A 20 20 0 0 1 372 392 L 332 392" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>

  <!-- Clock Hands inside Face -->
  <circle cx="256" cy="256" r="110" fill="#ffffff" fill-opacity="0.12"/>
  <path d="M 256 180 L 256 256 L 310 286" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="256" cy="256" r="14" fill="#ffffff"/>
  
  <!-- Checkmark Badge -->
  <circle cx="380" cy="380" r="64" fill="#10b981" stroke="#ffffff" stroke-width="12"/>
  <path d="M 356 380 L 372 396 L 406 362" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
