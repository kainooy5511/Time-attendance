<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ลงทะเบียนพนักงาน — Admin Only</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="js/api-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #090d16 0%, #111827 50%, #0b1329 100%);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --card-hover: rgba(255, 255, 255, 0.08);
      --input-bg: rgba(255, 255, 255, 0.06);
      --input-border: rgba(255, 255, 255, 0.12);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      --accent: #6366f1;
    }

    [data-theme="light"] {
      --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 50%, #f8fafc 100%);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(226, 232, 240, 0.85);
      --card-hover: rgba(255, 255, 255, 1);
      --input-bg: #ffffff;
      --input-border: #cbd5e1;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
      --accent: #4f46e5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    button, a, input, select { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Sarabun', sans-serif;
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 60px;
      position: relative;
    }

    .container {
      width: 100%;
      max-width: 520px;
      position: relative;
      z-index: 1;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9em;
      padding: 8px 14px;
      border-radius: 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
    }
    .back-btn:hover { color: var(--text-main); background: var(--card-hover); }

    .theme-toggle-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--card-bg); border: 1px solid var(--card-border);
      color: var(--text-main); display: flex; align-items: center; justify-content: center;
      font-size: 1.1em; cursor: pointer; backdrop-filter: blur(12px);
    }

    /* PIN Gate Overlay */
    .pin-gate {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
      margin-top: 40px;
    }
    .pin-icon { font-size: 42px; margin-bottom: 12px; }
    .pin-title { font-size: 1.4em; font-weight: 700; margin-bottom: 6px; }
    .pin-desc { font-size: 0.88em; color: var(--text-muted); margin-bottom: 20px; }
    .pin-input {
      width: 100%; max-width: 240px; text-align: center; font-size: 24px; letter-spacing: 6px;
      padding: 12px; border-radius: 14px; border: 1px solid var(--input-border);
      background: var(--input-bg); color: var(--text-main); outline: none; margin-bottom: 16px;
    }
    .btn-pin {
      padding: 12px 28px; border-radius: 14px; background: var(--accent);
      border: none; color: white; font-size: 15px; font-weight: 600; cursor: pointer;
    }

    /* Main Register Form */
    .register-content { display: none; }

    .page-header { text-align: center; margin-bottom: 20px; }
    h2 { font-size: 1.6em; font-weight: 700; margin-bottom: 4px; }
    .instruction { font-size: 0.88em; color: var(--text-muted); line-height: 1.5; }

    .step-dots {
      display: flex; justify-content: center; gap: 12px; margin-bottom: 16px;
    }
    .dot {
      width: 14px; height: 14px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.2);
    }
    .dot.active {
      background: #10b981; border-color: #34d399; box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
      transform: scale(1.15);
    }

    #status {
      text-align: center; font-size: 0.9em; color: #38bdf8; min-height: 24px; margin-bottom: 12px;
    }

    .video-wrapper {
      position: relative; width: 100%; border-radius: 20px; overflow: hidden;
      background: #000; box-shadow: var(--shadow); margin-bottom: 20px; aspect-ratio: 4/3;
    }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

    .form-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      backdrop-filter: blur(16px); border-radius: 20px; padding: 22px; box-shadow: var(--shadow);
    }

    .form-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 8px;
    }

    label { display: block; font-size: 0.82em; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
    input, select {
      width: 100%; padding: 12px 14px; background: var(--input-bg);
      border: 1px solid var(--input-border); border-radius: 12px; color: var(--text-main);
      font-size: 14px; font-family: inherit; outline: none; margin-bottom: 12px;
    }
    select option { background: #1e293b; color: #fff; }
    [data-theme="light"] select option { background: #fff; color: #0f172a; }

    .btn-save {
      background: linear-gradient(135deg, #6366f1, #4f46e5); color: white;
      border: none; border-radius: 14px; font-family: inherit; font-size: 16px; font-weight: 600;
      padding: 15px; width: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center;
      gap: 10px; box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4); margin-top: 6px;
    }
    .btn-save:disabled { background: rgba(255, 255, 255, 0.1); color: #64748b; cursor: not-allowed; }

    .count-badge { background: rgba(255, 255, 255, 0.2); padding: 2px 8px; border-radius: 12px; }
    #msg { margin-top: 14px; text-align: center; font-size: 0.9em; line-height: 1.5; }
    .msg-success { color: #34d399; }
    .msg-error   { color: #f87171; }
  </style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <a href="index.html" class="back-btn">← กลับเมนูหลัก</a>
    <button class="theme-toggle-btn" id="themeBtn" onclick="toggleTheme()" title="เปลี่ยนธีม">🌙</button>
  </div>

  <!-- PIN Protection Gate (Admin Only) -->
  <div id="pinGate" class="pin-gate">
    <div class="pin-icon">🔒</div>
    <div class="pin-title">ส่วนสำหรับผู้ดูแลระบบ (Admin Only)</div>
    <p class="pin-desc">หน้านี้สงวนสิทธิ์เฉพาะผู้ดูแลระบบ กรุณากรอก Admin PIN เพื่อดำเนินการ</p>
    <div>
      <input type="password" id="pinInput" class="pin-input" maxlength="8" placeholder="••••" onkeypress="if(event.key==='Enter') verifyPin()">
    </div>
    <button class="btn-pin" onclick="verifyPin()">ยืนยันรหัสผ่าน Admin</button>
    <div id="pinError" style="color:#f87171; margin-top:12px; display:none;">❌ รหัสผ่าน Admin ไม่ถูกต้อง</div>
    <p style="font-size:0.78em; color:var(--text-muted); margin-top:14px;">(รหัสเริ่มต้นคือ 1234)</p>
  </div>

  <!-- Main Register UI -->
  <div id="registerContent" class="register-content">
    <div class="page-header">
      <h2>👤 ลงทะเบียนพนักงานใหม่</h2>
      <p class="instruction">กำหนดรหัส PIN 4 หลักประจำตัวพนักงาน และมองกล้องบันทึก 3 มุมมอง</p>
    </div>

    <div class="step-dots">
      <div class="dot" id="dot1"></div>
      <div class="dot" id="dot2"></div>
      <div class="dot" id="dot3"></div>
    </div>

    <div id="status">กำลังเชื่อมต่อกล้องและ AI Model...</div>

    <div class="video-wrapper">
      <video id="video" autoplay muted playsinline></video>
    </div>

    <div class="form-card">
      <div class="form-row">
        <div>
          <label>รหัสพนักงาน (Emp ID)</label>
          <input type="text" id="employeeId" placeholder="เช่น EMP001">
        </div>
        <div>
          <label>🔑 รหัส PIN 4 หลักของพนักงาน</label>
          <input type="password" id="userPin" maxlength="4" placeholder="เช่น 5678" title="พนักงานใช้ PIN นี้เพื่อเปิดดูประวัติส่วนตัว">
        </div>
      </div>

      <div class="form-row">
        <div>
          <label>ระดับสิทธิ์ (Role)</label>
          <select id="role">
            <option value="พนักงานทั่วไป">พนักงานทั่วไป (Staff)</option>
            <option value="ผู้ดูแลระบบ">ผู้ดูแลระบบ (Admin)</option>
          </select>
        </div>
        <div>
          <label>แผนก / ฝ่าย</label>
          <select id="department">
            <option value="ทั่วไป">ฝ่ายทั่วไป</option>
            <option value="ฝ่ายบัญชี">ฝ่ายบัญชี &amp; การเงิน</option>
            <option value="ฝ่ายบุคคล">ฝ่ายบุคคล (HR)</option>
            <option value="ฝ่ายขาย">ฝ่ายขายและการตลาด</option>
            <option value="ฝ่ายผลิต">ฝ่ายผลิต / ช่าง</option>
            <option value="คลังสินค้า">คลังสินค้า &amp; จัดส่ง</option>
            <option value="ผู้บริหาร">ฝ่ายบริหาร</option>
          </select>
        </div>
      </div>

      <label>ชื่อ-นามสกุลพนักงาน</label>
      <input type="text" id="username" placeholder="เช่น สมชาย ใจดี">

      <button id="btnSave" class="btn-save" onclick="saveFace()" disabled>
        📸 บันทึกใบหน้า <span id="saveCount" class="count-badge">0 / 3</span>
      </button>

      <div id="msg"></div>
    </div>
  </div>
</div>

<script>
  function initTheme() {
    const saved = localStorage.getItem('app_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
    document.getElementById('themeBtn').innerText = saved === 'light' ? '☀️' : '🌙';
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme') || 'dark';
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('app_theme', next);
    document.getElementById('themeBtn').innerText = next === 'light' ? '☀️' : '🌙';
  }

  const API_URL   = localStorage.getItem('gasApiUrl') || (typeof GAS_API_URL !== 'undefined' ? GAS_API_URL : '');
  const video     = document.getElementById('video');
  const statusDiv = document.getElementById('status');
  const btnSave   = document.getElementById('btnSave');
  const msgDiv    = document.getElementById('msg');
  const countSpan = document.getElementById('saveCount');
  let saveCounter = 0;

  let adminPin = localStorage.getItem('admin_pin') || '1234';

  function verifyPin() {
    const input = document.getElementById('pinInput').value.trim();
    if (input === adminPin) {
      document.getElementById('pinGate').style.display = 'none';
      document.getElementById('registerContent').style.display = 'block';
      sessionStorage.setItem('is_admin_authenticated', 'true');
      initModels();
    } else {
      document.getElementById('pinError').style.display = 'block';
    }
  }

  function updateDots() {
    [1, 2, 3].forEach(i => {
      const dot = document.getElementById('dot' + i);
      dot.className = 'dot' + (i <= saveCounter ? ' active' : '');
    });
  }

  async function initModels() {
    try {
      const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
      await Promise.all([
        faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
        faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
      ]);
      startCamera();
    } catch (e) {
      statusDiv.innerHTML = '<span style="color:#f87171">❌ โหลด AI Model ล้มเหลว: ' + e.message + '</span>';
    }
  }

  function startCamera() {
    // Defensive check: Browser security blocks getUserMedia on non-HTTPS origins (except localhost)
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      statusDiv.innerHTML = '<span style="color:#f87171">⚠️ เบราว์เซอร์บล็อกกล้องเนื่องจากไม่ใช่ HTTPS<br>กรุณาเปิดผ่าน https:// (Netlify) หรือ http://localhost บนเครื่องนี้</span>';
      return;
    }

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
      .then(stream => {
        video.srcObject = stream;
        statusDiv.innerText = '✅ กล้องพร้อมใช้งาน กรุณากรอกข้อมูลและส่องหน้า';
        statusDiv.style.color = '#34d399';
        btnSave.disabled = false;
      })
      .catch(err => {
        statusDiv.innerHTML = '<span style="color:#f87171">❌ เปิดกล้องไม่ได้: ' + err.message + '</span>';
      });
  }

  async function saveFace() {
    const empId = document.getElementById('employeeId').value.trim() || ('EMP' + Math.floor(1000 + Math.random() * 9000));
    const name  = document.getElementById('username').value.trim();
    const dept  = document.getElementById('department').value;
    const role  = document.getElementById('role').value;
    const pin   = document.getElementById('userPin').value.trim() || '1234';

    if (!name) return alert('กรุณากรอกชื่อ-นามสกุลพนักงาน');
    if (pin.length < 4) return alert('กรุณากำหนดรหัส PIN อย่างน้อย 4 หลักสำหรับพนักงานคนนี้');

    btnSave.disabled = true;
    btnSave.innerHTML = '⏳ กำลังวิเคราะห์ใบหน้า... <span class="count-badge">' + saveCounter + ' / 3</span>';
    msgDiv.innerText = '';

    const detection = await faceapi
      .detectSingleFace(video)
      .withFaceLandmarks()
      .withFaceDescriptor();

    if (!detection) {
      alert('ไม่พบใบหน้า! กรุณามองกล้องในที่สว่างให้ชัดเจน');
      btnSave.disabled = false;
      btnSave.innerHTML = '📸 บันทึกใบหน้า <span class="count-badge">' + saveCounter + ' / 3</span>';
      return;
    }

    const descriptorArray = Array.from(detection.descriptor);

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'registerUser',
          employeeId: empId,
          name: name,
          department: dept,
          role: role,
          pin: pin,
          faceDescriptor: descriptorArray
        })
      });
      const data = await res.json();

      saveCounter++;
      countSpan.innerText = saveCounter + ' / 3';
      updateDots();

      if (saveCounter >= 3) {
        msgDiv.innerHTML = '<span class="msg-success">🎉 ลงทะเบียนสำเร็จเรียบร้อย! (สิทธิ์: ' + role + ' | PIN: ' + pin + ')</span>';
        btnSave.innerHTML = '✅ ลงทะเบียนสำเร็จ';
        btnSave.disabled = true;

        // บันทึกลงแคชทันทีเพื่อให้หน้าสแกนตรวจจับใบหน้าได้ทันทีโดยไม่ต้องรอรอบซิงก์
        try {
          const cached = JSON.parse(localStorage.getItem('cached_known_faces') || '[]');
          cached.push({
            name: name,
            label: name,
            employeeId: empId,
            department: dept,
            role: role,
            pin: pin,
            descriptor: descriptorArray
          });
          localStorage.setItem('cached_known_faces', JSON.stringify(cached));
        } catch(e) {}

        setTimeout(() => { window.location.href = 'index.html'; }, 2000);
      } else {
        msgDiv.innerHTML = '<span class="msg-success">✅ บันทึกมุมที่ ' + saveCounter + ' สำเร็จ! กรุณาเอียงหน้าเล็กน้อยแล้วกดอีกครั้ง</span>';
        btnSave.disabled = false;
        btnSave.innerHTML = '📸 บันทึกมุมถัดไป <span class="count-badge">' + saveCounter + ' / 3</span>';
      }
    } catch (e) {
      msgDiv.innerHTML = '<span class="msg-error">❌ บันทึกล้มเหลว: ' + e.message + '</span>';
      btnSave.disabled = false;
      btnSave.innerHTML = '📸 บันทึกใบหน้า <span class="count-badge">' + saveCounter + ' / 3</span>';
    }
  }

  window.addEventListener('load', () => {
    initTheme();
    if (API_URL) {
      fetch(API_URL + '?action=getConfig')
        .then(r => r.json())
        .then(cfg => { if (cfg.adminPin) adminPin = cfg.adminPin; })
        .catch(() => {});
    }
    if (sessionStorage.getItem('is_admin_authenticated') === 'true') {
      document.getElementById('pinGate').style.display = 'none';
      document.getElementById('registerContent').style.display = 'block';
      initModels();
    }
  });
</script>

</body>
</html>
